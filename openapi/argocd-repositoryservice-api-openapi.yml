openapi: 3.2.0
info:
  description: Description of all APIs
  title: Consolidate Services Repository Service API
  version: version not set
tags:
- name: RepositoryService
paths:
  /api/v1/repositories:
    get:
      tags:
      - RepositoryService
      summary: ListRepositories gets a list of all configured repositories
      operationId: RepositoryService_ListRepositories
      parameters:
      - description: Repo URL for query.
        name: repo
        in: query
        schema:
          type: string
      - description: Whether to force a cache refresh on repo's connection state.
        name: forceRefresh
        in: query
        schema:
          type: boolean
      - description: App project for query.
        name: appProject
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1RepositoryList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
      - RepositoryService
      summary: CreateRepository creates a new repository configuration
      operationId: RepositoryService_CreateRepository
      parameters:
      - description: Whether to create in upsert mode.
        name: upsert
        in: query
        schema:
          type: boolean
      - description: Whether to operate on credential set instead of repository.
        name: credsOnly
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1alpha1Repository'
        description: Repository definition
        required: true
  /api/v1/repositories/{repo.repo}:
    put:
      tags:
      - RepositoryService
      summary: UpdateRepository updates a repository configuration
      operationId: RepositoryService_UpdateRepository
      parameters:
      - description: Repo contains the URL to the remote repository
        name: repo.repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1alpha1Repository'
        required: true
  /api/v1/repositories/{repo}:
    get:
      tags:
      - RepositoryService
      summary: Get returns a repository or its credentials
      operationId: RepositoryService_Get
      parameters:
      - description: Repo URL for query
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: Whether to force a cache refresh on repo's connection state.
        name: forceRefresh
        in: query
        schema:
          type: boolean
      - description: App project for query.
        name: appProject
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Repository'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
      - RepositoryService
      summary: DeleteRepository deletes a repository from the configuration
      operationId: RepositoryService_DeleteRepository
      parameters:
      - description: Repo URL for query
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: Whether to force a cache refresh on repo's connection state.
        name: forceRefresh
        in: query
        schema:
          type: boolean
      - description: App project for query.
        name: appProject
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repositoryRepoResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /api/v1/repositories/{repo}/apps:
    get:
      tags:
      - RepositoryService
      summary: ListApps returns list of apps in the repo
      operationId: RepositoryService_ListApps
      parameters:
      - name: repo
        in: path
        required: true
        schema:
          type: string
      - name: revision
        in: query
        schema:
          type: string
      - name: appName
        in: query
        schema:
          type: string
      - name: appProject
        in: query
        schema:
          type: string
      responses:
