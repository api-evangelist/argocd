aid: argocd
url: https://raw.githubusercontent.com/api-evangelist/argocd/refs/heads/main/apis.yml
name: Argo CD
kind: opensource
description: >-
  Argo CD is a declarative GitOps continuous-delivery tool for Kubernetes, part of the CNCF Graduated Argo project. The
  argocd-server component exposes a gRPC and REST API used by the Web UI, the argocd CLI, and CI/CD systems. APIs cover
  applications, projects, clusters, repositories, accounts, certificates, GPG keys, sessions, settings, and
  notifications. Argo CD is also a Kubernetes operator that defines first-class CRDs (Application, ApplicationSet,
  AppProject) — those CRDs are themselves a Kubernetes-native API. Argo CD is open-source under the Apache 2.0 license;
  commercial offerings are provided by third parties (notably Akuity, founded by the Argo project's creators) rather
  than the Argo CD project itself.
