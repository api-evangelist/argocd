  /api/v1/applications/{name}/logs:
    get:
      tags:
      - ApplicationService
      summary: PodLogs returns stream of log entries for the specified pod. Pod
      operationId: ApplicationService_PodLogs2
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - type: string
        name: namespace
        in: query
      - type: string
        name: podName
        in: query
      - type: string
        name: container
        in: query
      - type: string
        format: int64
        name: sinceSeconds
        in: query
      - type: string
        format: int64
        description: 'Represents seconds of UTC time since Unix epoch

          1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to

          9999-12-31T23:59:59Z inclusive.'
        name: sinceTime.seconds
        in: query
      - type: integer
        format: int32
        description: 'Non-negative fractions of a second at nanosecond resolution. Negative

          second values with fractions must still have non-negative nanos values

          that count forward in time. Must be from 0 to 999,999,999

          inclusive. This field may be limited in precision depending on context.'
        name: sinceTime.nanos
        in: query
      - type: string
        format: int64
        name: tailLines
        in: query
      - type: boolean
        name: follow
        in: query
      - type: string
        name: untilTime
        in: query
      - type: string
        name: filter
        in: query
      - type: string
        name: kind
        in: query
      - type: string
        name: group
        in: query
      - type: string
        name: resourceName
        in: query
      - type: boolean
        name: previous
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      - type: boolean
        name: matchCase
        in: query
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            title: Stream result of applicationLogEntry
            properties:
              error:
                $ref: '#/definitions/runtimeStreamError'
              result:
                $ref: '#/definitions/applicationLogEntry'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{name}/manifests:
    get:
      tags:
      - ApplicationService
      summary: GetManifests returns application manifests
      operationId: ApplicationService_GetManifests
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - type: string
        name: revision
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      - type: array
        items:
          type: string
          format: int64
        collectionFormat: multi
        name: sourcePositions
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        name: revisions
        in: query
      - type: boolean
        name: noCache
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/repositoryManifestResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{name}/operation:
    delete:
      tags:
