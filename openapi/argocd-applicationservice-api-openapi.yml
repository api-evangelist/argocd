        name: sinceTime.nanos
        in: query
      - type: string
        format: int64
        name: tailLines
        in: query
      - type: boolean
        name: follow
        in: query
      - type: string
        name: untilTime
        in: query
      - type: string
        name: filter
        in: query
      - type: string
        name: kind
        in: query
      - type: string
        name: group
        in: query
      - type: string
        name: resourceName
        in: query
      - type: boolean
