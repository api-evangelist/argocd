swagger: '2.0'
info:
  description: Description of all APIs
  title: Consolidate Services AccountService ApplicationService API
  version: version not set
consumes:
- application/json
produces:
- application/json
tags:
- name: ApplicationService
paths:
  /api/v1/applications:
    get:
      tags:
      - ApplicationService
      summary: List returns list of applications
      operationId: ApplicationService_List
      parameters:
      - type: string
        description: the application's name.
        name: name
        in: query
      - type: string
        description: forces application reconciliation if set to 'hard'.
        name: refresh
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        description: the project names to restrict returned list applications.
        name: projects
        in: query
      - type: string
        description: when specified with a watch call, shows changes that occur after that particular version of a resource.
        name: resourceVersion
        in: query
      - type: string
        description: the selector to restrict returned list to applications only with matched labels.
        name: selector
        in: query
      - type: string
        description: the repoURL to restrict returned list applications.
        name: repo
        in: query
      - type: string
        description: the application's namespace.
        name: appNamespace
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        description: the project names to restrict returned list applications (legacy name for backwards-compatibility).
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1ApplicationList'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
    post:
      tags:
      - ApplicationService
      summary: Create creates an application
      operationId: ApplicationService_Create
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/v1alpha1Application'
      - type: boolean
        name: upsert
        in: query
      - type: boolean
        name: validate
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/manifestsWithFiles:
    post:
      tags:
      - ApplicationService
      summary: GetManifestsWithFiles returns application manifests using provided files to generate them
      operationId: ApplicationService_GetManifestsWithFiles
      parameters:
      - description: ' (streaming inputs)'
        name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/applicationApplicationManifestQueryWithFilesWrapper'
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/repositoryManifestResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{appName}/server-side-diff:
    get:
      tags:
      - ApplicationService
      summary: ServerSideDiff performs server-side diff calculation using dry-run apply
      operationId: ApplicationService_ServerSideDiff
      parameters:
      - type: string
        name: appName
        in: path
        required: true
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        name: targetManifests
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/applicationApplicationServerSideDiffResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{application.metadata.name}:
    put:
      tags:
      - ApplicationService
      summary: Update updates an application
      operationId: ApplicationService_Update
      parameters:
      - type: string
        description: 'Name must be unique within a namespace. Is required when creating resources, although

          some resources may allow a client to request the generation of an appropriate name

          automatically. Name is primarily intended for creation idempotence and configuration

          definition.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

          +optional'
        name: application.metadata.name
        in: path
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/v1alpha1Application'
      - type: boolean
        name: validate
        in: query
      - type: string
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{applicationName}/managed-resources:
    get:
      tags:
      - ApplicationService
      summary: ManagedResources returns list of managed resources
      operationId: ApplicationService_ManagedResources
      parameters:
      - type: string
        name: applicationName
        in: path
        required: true
      - type: string
        name: namespace
        in: query
      - type: string
        name: name
        in: query
      - type: string
        name: version
        in: query
      - type: string
        name: group
        in: query
      - type: string
        name: kind
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/applicationManagedResourcesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{applicationName}/resource-tree:
    get:
      tags:
      - ApplicationService
      summary: ResourceTree returns resource tree
      operationId: ApplicationService_ResourceTree
      parameters:
      - type: string
        name: applicationName
        in: path
        required: true
      - type: string
        name: namespace
        in: query
      - type: string
        name: name
        in: query
      - type: string
        name: version
        in: query
      - type: string
        name: group
        in: query
      - type: string
        name: kind
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1ApplicationTree'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{name}:
    get:
      tags:
      - ApplicationService
      summary: Get returns an application by name
      operationId: ApplicationService_Get
      parameters:
      - type: string
        description: the application's name
        name: name
        in: path
        required: true
      - type: string
        description: forces application reconciliation if set to 'hard'.
        name: refresh
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        description: the project names to restrict returned list applications.
        name: projects
        in: query
      - type: string
        description: when specified with a watch call, shows changes that occur after that particular version of a resource.
        name: resourceVersion
        in: query
      - type: string
        description: the selector to restrict returned list to applications only with matched labels.
        name: selector
        in: query
      - type: string
        description: the repoURL to restrict returned list applications.
        name: repo
        in: query
      - type: string
        description: the application's namespace.
        name: appNamespace
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        description: the project names to restrict returned list applications (legacy name for backwards-compatibility).
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
    delete:
      tags:
      - ApplicationService
      summary: Delete deletes an application
      operationId: ApplicationService_Delete
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - type: boolean
        name: cascade
        in: query
      - type: string
        name: propagationPolicy
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/applicationApplicationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
    patch:
      tags:
      - ApplicationService
      summary: Patch patch an application
      operationId: ApplicationService_Patch
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/applicationApplicationPatchRequest'
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1alpha1Application'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{name}/events:
    get:
      tags:
      - ApplicationService
      summary: ListResourceEvents returns a list of event resources
      operationId: ApplicationService_ListResourceEvents
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - type: string
        name: resourceNamespace
        in: query
      - type: string
        name: resourceName
        in: query
      - type: string
        name: resourceUID
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1EventList'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
