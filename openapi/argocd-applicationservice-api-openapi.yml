            title: Stream result of applicationLogEntry
            properties:
              error:
                $ref: '#/definitions/runtimeStreamError'
              result:
                $ref: '#/definitions/applicationLogEntry'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/runtimeError'
  /api/v1/applications/{name}/resource:
    get:
      tags:
      - ApplicationService
      summary: GetResource returns single application resource
      operationId: ApplicationService_GetResource
      parameters:
      - type: string
        name: name
        in: path
        required: true
      - type: string
        name: namespace
        in: query
      - type: string
        name: resourceName
        in: query
      - type: string
        name: version
        in: query
      - type: string
        name: group
        in: query
      - type: string
        name: kind
        in: query
      - type: string
        name: appNamespace
        in: query
      - type: string
        name: project
        in: query
      responses:
